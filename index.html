<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Panel | Akhtar Muhammad</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ff6b1a'/%3E%3Ctext x='32' y='43' font-size='28' font-weight='800' text-anchor='middle' fill='%2315171b' font-family='Arial'%3EAM%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="admin.css">
  <script>try{var t=localStorage.getItem('cms-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body>

  <!-- Login -->
  <div id="login" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="brand-mark">AM</div>
      <h1>Admin Panel</h1>
      <p class="muted" id="login-msg">Log in to manage your website.</p>
      <label class="field"><span>Username</span><input id="login-user" name="username" type="text" autocomplete="username" required autofocus></label>
      <label class="field"><span>Password</span><input id="login-pass" name="password" type="password" autocomplete="current-password" required></label>
      <p class="form-error" id="login-error" role="alert" hidden></p>
      <button class="btn btn-primary wide" type="submit" id="login-btn">Log in</button>
      <a class="back-link" href="../index.html">Back to the website</a>
    </form>
  </div>

  <!-- Dashboard -->
  <div id="app" class="app" hidden>
    <aside class="side" id="side">
      <div class="side-brand"><span class="brand-mark">AM</span><div><strong>Admin Panel</strong><small id="side-user"></small></div></div>
      <nav id="nav" aria-label="Admin sections"></nav>
    </aside>
    <div class="scrim" id="scrim"></div>
    <div class="main">
      <header class="top">
        <button class="menu-btn" id="menu-btn" aria-label="Open menu"><span></span><span></span><span></span></button>
        <h2 id="top-title">Dashboard</h2>
        <div class="top-actions">
          <a class="btn btn-ghost small" href="../index.html" target="_blank" rel="noopener">View website</a>
          <button class="btn btn-ghost small" id="logout-btn">Log out</button>
        </div>
      </header>
      <div id="banner"></div>
      <main id="view" tabindex="-1"></main>
    </div>
    <div class="savebar" id="savebar" hidden>
      <span>You have changes that are not saved yet.</span>
      <div><button class="btn btn-ghost small" id="discard-btn">Discard</button><button class="btn btn-primary small" id="save-btn">Save changes</button></div>
    </div>
  </div>

  <div id="modal" class="modal" hidden><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h3 id="modal-title"></h3><div id="modal-body"></div></div></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/site-defaults.js"></script>
  <script src="admin.js"></script>
</body>
</html>
